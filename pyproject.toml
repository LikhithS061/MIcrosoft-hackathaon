[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eco_guard"]

[project]
name = "eco-guard"
version = "2.0.0"
description = "A resilient, local-first, multi-agent disaster mitigation engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.1.0",

    # State validation
    "pydantic>=2.7.0",

    # Observability
    "langfuse>=2.36.0",

    # Vector DB client (Qdrant)
    "qdrant-client>=1.9.0",

    # Graph DB client (Neo4j)
    "neo4j>=5.20.0",

    # Async utilities
    "anyio>=4.3.0",
    "httpx>=0.27.0",

    # ChromaDB for Regulatory RAG
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.0",
    "sentence-transformers>=3.0.0",

    # SQLite async for Learning Engine
    "aiosqlite>=0.20.0",

    # Web API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",

    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
